<style>

.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}

.stat span{font-family:Silkscreen,monospace;font-size:10px;color:var(--mid)}
.rowtitle{font-family:"Bebas Neue",Impact,sans-serif;font-size:34px;letter-spacing:.5px;font-weight:400;margin:40px 0 14px}
.review{display:grid;grid-template-columns:1fr 1fr;gap:12px}

button.chip{cursor:pointer;color:var(--black)}button.chip:hover{background:var(--amber)}

.foot{border-top:2px solid var(--black);margin-top:50px;padding:18px 0 40px;font-size:12px;color:var(--mid);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.foot .author{font-family:Silkscreen,monospace;font-size:11px;color:var(--black);border:2px solid var(--black);padding:4px 10px;box-shadow:3px 3px 0 var(--red);background:#fff}

@media (max-width:900px){.intro,.end{grid-template-columns:1fr}.review{grid-template-columns:1fr}}
@media (max-width:640px){.top .chip.hide-s{display:none}.top .wrap{gap:8px}.logo{font-size:26px}.target{min-width:170px}.target.opt{width:120px}.code{font-size:10.5px}.sign{grid-template-columns:28px 1fr;padding:6px 8px 6px 6px;gap:7px}.tico{font-size:14px}.ground .msg{font-size:12px;flex-direction:column;align-items:flex-start;gap:0;top:8px}.ground .msg b{font-size:19px}.rules{grid-template-columns:1fr}.arena{cursor:default}.cross{display:none}.bosspanel .code{font-size:11px}.bosspanel .q{font-size:20px}}
@media (prefers-reduced-motion:reduce){.cloud,.fl{animation:none}}
</style>

<script>
/* =========================================================
   Pixel art
   ========================================================= */
function outlined(G,col){
 const h=G.length,w=G[0].length;const O=Array.from({length:h+2},()=>Array(w+2).fill(null));
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)O[y+1][x+1]=G[y][x];
 const R=O.map(r=>r.slice());
 for(let y=0;y<h+2;y++)for(let x=0;x<w+2;x++){if(O[y][x])continue;if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>O[y+dy]&&O[y+dy][x+dx]))R[y][x]=col||'#141414'}
 return R;
}
function toURL(G,s){const c=document.createElement('canvas');c.width=G[0].length*s;c.height=G.length*s;const x=c.getContext('2d');for(let y=0;y<G.length;y++)for(let i=0;i<G[y].length;i++){const v=G[y][i];if(v){x.fillStyle=v;x.fillRect(i*s,y*s,s,s)}}return c.toDataURL()}
const P={K:'#141414',W:'#ffffff',R:'#E50914',D:'#B20710',A:'#F5A524',G:'#2E9E5B',g:'#1f7a45',S:'#e9e9e9',s:'#d6d6d6',B:'#2B6CB0'};
function gridURL(rows,s,outline){const G=rows.map(r=>r.split('').map(c=>c==='.'?null:P[c]));return toURL(outline?outlined(G):G,s)}
const BIRD_A=gridURL(['RR..........RR','RRR........RRR','.RRR..KK..RRR.','..RRRKKKKRRR..','....KKWKKK....','....KKKKKKA...','.....KKKK.....'],5,false);
const BIRD_B=gridURL(['..............','......KK......','....KKKKKK....','..RRKKWKKKRR..','.RRRRKKKKKARRR','RRR..KKKK..RRR','RR..........RR'],5,false);
const CLOUD=gridURL(['....SSSS......','..SSSSSSSS.SS.','.SSSSSSSSSSSSS','SSSSSSSSSSSSSS','.ssssssssssss.'],10,false);
const BUSH=gridURL(['....GGG....GG...','..GGGGGGGGGGGG..','.GGGgGGGGGGgGGG.','GGGGGGGgGGGGGGGG','GgGGGGGGGGGGgGGG'],9,true);
/* Mascota: la taza de Java (pixel art original) */
const CUP_ROWS=o=>['.....S..S..S....','....S..S..S.....','.....S..S..S....','................','.KKKKKKKKKKKKK..','.KWRRRRRRRRRRK..',o.blink?'.KRRRRRRRRRRRKKK':'.KRWWRRRRRWWRKKK',o.blink?'.KRKKRRRRRKKRK.K':'.KRWKRRRRRWKRK.K','.KRRRRRRRRRRRK.K',o.smile?'.KRRKRRRRRKRRKKK':'.KRRRRRRRRRRRKKK',o.smile?'.KRRRKKKKKRRRK..':'.KRRRRKKKRRRRK..','..KRRRRRRRRRK...','...KKKKKKKKK....','.KKKKKKKKKKKKK..','..KAAAAAAAAAK...','...KKKKKKKKK....'];
const _cup={};function cup(o){o=o||{};const k=JSON.stringify(o);return _cup[k]||(_cup[k]=gridURL(CUP_ROWS(o),8,true))}
const RETICLE='<svg class="cross" id="cross" viewBox="0 0 44 44"><rect x="20" y="0" width="4" height="14" fill="#E50914"/><rect x="20" y="30" width="4" height="14" fill="#E50914"/><rect x="0" y="20" width="14" height="4" fill="#E50914"/><rect x="30" y="20" width="14" height="4" fill="#E50914"/><rect x="18" y="18" width="8" height="8" fill="#141414"/><rect x="8" y="8" width="28" height="28" fill="none" stroke="#141414" stroke-width="2" stroke-dasharray="4 4"/></svg>';

/* =========================================================
   Temas y banco de fragmentos
   Contexto: v es int[], m es int[][] de 3×4, t es char[8][8],
   r es Random, sc es Scanner, suma es int.
   bug:true  → compila mal, falla al ejecutar o no hace lo que dice el comentario
   ========================================================= */
const TOPIC={
 a1:{n:'Arrays 1D',ab:'1D',col:'#E50914'},
 rec:{n:'Recorridos',ab:'FOR',col:'#2B6CB0'},
 rnd:{n:'Random',ab:'RND',col:'#F5A524'},
 m2:{n:'Matrices 2D',ab:'2D',col:'#2E9E5B'},
 scn:{n:'Scanner',ab:'SCN',col:'#141414'}
};
const BANK=[
 // ---------- Arrays 1D
 {t:'a1',bug:1,c:'int[] v = new int[5];\nv[5] = 9;',x:'Los índices de un arreglo de 5 van de 0 a 4. v[5] lanza ArrayIndexOutOfBoundsException.'},
 {t:'a1',bug:0,c:'int[] v = {3, 7, 1};\nSystem.out.println(v.length);',x:'Imprime 3. En los arreglos, length es un atributo, sin paréntesis.'},
 {t:'a1',bug:1,c:'int[] v = {3, 7, 1};\nint n = v.length();',x:'No compila: en arreglos es v.length (atributo). length() es de String.'},
 {t:'a1',bug:0,c:'int v[] = new int[4];',x:'Válido: Java acepta los corchetes después del nombre (estilo C), aunque se prefiere int[] v.'},
 {t:'a1',bug:1,c:'int[] v = new int[];',x:'No compila: al usar new sin llaves hay que indicar el tamaño, por ejemplo new int[4].'},
 {t:'a1',bug:0,c:'double[] p = new double[3];\nSystem.out.println(p[0]);',x:'Imprime 0.0: los arreglos numéricos se inicializan en cero.'},
 {t:'a1',bug:1,c:'String[] s = new String[2];\nSystem.out.println(s[0].length());',x:'Los arreglos de objetos empiezan en null. s[0].length() lanza NullPointerException.'},
 {t:'a1',bug:0,c:'int[] v = {1, 2, 3};\nint u = v[v.length - 1];\n// u = 3',x:'v.length - 1 es el índice del último elemento: u vale 3.'},
 {t:'a1',bug:1,c:'int[] v = new int[3];\nv = {4, 5, 6};',x:'No compila: las llaves solas solo sirven al declarar. Usa v = new int[]{4, 5, 6};'},
 {t:'a1',bug:0,c:'int[] v = new int[]{4, 5, 6};',x:'Válido: crea el arreglo y lo llena en una sola instrucción.'},
 {t:'a1',bug:0,c:'int[] a = {1, 2};\nint[] b = a;\nb[0] = 9;\n// ahora a[0] también vale 9',x:'b = a copia la referencia, no los datos: a y b son el mismo arreglo.'},
 {t:'a1',bug:1,c:'int[] a = {1, 2};\nint[] b = {1, 2};\nboolean eq = (a == b); // true',x:'== compara referencias: son dos arreglos distintos, eq es false. Usa Arrays.equals(a, b).'},
 {t:'a1',bug:1,c:'char[] c = {\'h\', \'o\', \'l\', \'a\'};\nSystem.out.println(c[4]);',x:'Tiene 4 elementos (índices 0 a 3). c[4] se sale del arreglo.'},
 {t:'a1',bug:0,c:'boolean[] f = new boolean[2];\n// f[1] vale false',x:'Los boolean de un arreglo nuevo empiezan en false.'},
 {t:'a1',bug:1,c:'int[] v = new int[-1];',x:'Compila, pero al ejecutar lanza NegativeArraySizeException.'},
 {t:'a1',bug:0,c:'int[] v = {5, 8};\nv[1]++;\n// v queda {5, 9}',x:'v[1]++ incrementa el segundo elemento: 8 pasa a 9.'},
 // ---------- Recorridos
 {t:'rec',bug:1,c:'for (int i = 0; i <= v.length; i++)\n  suma += v[i];',x:'Con <= la última vuelta usa v[v.length], que no existe. La condición correcta es i < v.length.'},

function buildWaves(){
 const used=new Set(),usedB=new Set();
 return WAVES.map(W=>{
  let rounds=[];
  W.src.forEach(([topics,n])=>{
   const pool=shuffle(BANK.filter(b=>topics.includes(b.t)&&!used.has(b)));
   const bugs=pool.filter(b=>b.bug),oks=pool.filter(b=>!b.bug);
   const nb=Math.random()<.5?Math.ceil(n/2):Math.floor(n/2);
   const pick=bugs.slice(0,nb).concat(oks.slice(0,n-nb));
   pick.forEach(b=>{used.add(b);rounds.push({kind:'snip',item:b})});
  });
  rounds=shuffle(rounds);
  // Jefes: nunca se repite uno en la misma partida; en el jefe final se prefieren temas distintos
  const temas=new Set();
  const bosses=W.boss.map((tp,k)=>{
   const libres=BOSS.filter(b=>tp.includes(b.t)&&!usedB.has(b));
   const pool=libres.filter(b=>!temas.has(b.t)).length?libres.filter(b=>!temas.has(b.t)):libres.length?libres:BOSS.filter(b=>tp.includes(b.t));
   const bp=shuffle(pool)[0];usedB.add(bp);temas.add(bp.t);
   return {kind:'boss',item:bp,bossNo:k+1,bossOf:W.boss.length};
  });
  if(W.rush)rounds=rounds.concat(bosses);
  else{const mid=Math.ceil(rounds.length/2);rounds.splice(mid,0,bosses[0]);rounds=rounds.concat(bosses.slice(1))}
  rounds.forEach(r=>{r.ammo=3;r.res=null;r.spawned=false});
  return rounds;
 });
}

function resolveBoss(o,how){
 const r=o.round,b=r.item;G.boss.done=true;G.boss.doneAt=performance.now();const pn=$('#boss');if(pn)pn.classList.add('done');
 const ok=how==='shot'&&o.correct;r.res=ok?'ok':'bad';
 const cx=o.x+o.w/2,cy=Math.max(30,o.y+20);
 if(ok){G.combo++;G.best=Math.max(G.best,G.combo);const pts=300*mult();G.score+=pts;SFX.hit();setTimeout(SFX.wave,200);fx(cx,cy,'👑 JEFE DERROTADO +'+pts,'#E50914');msg('¡JEFE DERROTADO!',b.x)}
 else{G.combo=0;G.lives--;SFX.bad();shakeArena();
  if(how==='shot'){fx(cx,cy,'NO ERA '+o.opt,'#141414');dog(`¡No! La respuesta era ${b.ops[0]}.`)}
  else{fx(AW2()/2,60,'EL JEFE ESCAPÓ','#E50914');dog(`Se fue… era ${b.ops[0]}.`)}
  msg('ERA '+b.ops[0],b.x)}
 G.live.forEach(q=>{if(q.round===r&&q!==o&&q.state==='fly'){q.state='escape';q.silent=true}});
 G.log.push({r,ok,how,picked:o.opt});hud();
}
const AW2=()=>$('#arena').clientWidth;
function bindArena(){
 const ar=$('#arena'),cr=$('#cross');
 const pos=e=>{const r=ar.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return[p.clientX-r.left,p.clientY-r.top]};
 ar.addEventListener('mousemove',e=>{const[x,y]=pos(e);cr.style.left=x+'px';cr.style.top=y+'px'});
 ar.addEventListener('mouseleave',()=>{cr.style.left='-100px'});
 ar.addEventListener('pointerdown',e=>{
  if(G.paused||e.target.closest('.overlay')||e.target.closest('#mute'))return;
  const[x,y]=pos(e);
  const flying=G.live.filter(o=>o.state==='fly');
  const tg=e.target.closest('.target');const o=tg&&G.live.find(q=>q.el===tg&&q.state==='fly');
  const owner=o||flying[0];
  if(owner&&owner.round.ammo<=0){SFX.empty();fx(x,y-30,'SIN CARTUCHOS','#6b6b6b');return}
  if(owner)owner.round.ammo--;
  G.shots++;SFX.shot();flash();
  if(o){G.hits++;o.state='fall';o.vy=-120;o.el.classList.add('hit');bits(x,y);
   if(o.opt!==undefined){if(G.boss&&!G.boss.done)resolveBoss(o,'shot')}else resolve(o,'shot')}
  else{G.combo=0;fx(x,y-30,'¡FALLASTE!','#6b6b6b');hud()}
 });
}
function rank(sc,acc,jugadas){
 sc=Math.round(sc*4/Math.max(1,jugadas)); // umbrales pensados para 4 oleadas; se escalan a las jugadas
 if(sc>=9000&&acc>=85)return'Arquitecto de matrices';
 if(sc>=6000)return'Cazador de bugs certificado';
 if(sc>=3500)return'Recorredor de arreglos';
 if(sc>=1500)return'Aprendiz del índice';
 return'Novato del índice 0';
}
function gameOver(done){
 G.paused=true;cancelAnimationFrame(raf);SFX.over();
 const jugadas=G.wave-G.from+1;
 const best=G.solo?LS.get('cb_best',0):Math.max(LS.get('cb_best',0),G.score);if(!G.solo)LS.set('cb_best',best);
 const correct=G.log.filter(l=>l.ok).length,acc=G.log.length?Math.round(100*correct/G.log.length):0;
 const rt=rank(G.score,acc,jugadas);
 const wrong=G.log.filter(l=>!l.ok),right=G.log.filter(l=>l.ok);
 const byT={};G.log.forEach(l=>{const a=l.r.item.t;byT[a]=byT[a]||[0,0];byT[a][1]++;if(l.ok)byT[a][0]++});
 const weak=Object.entries(byT).filter(([a,v])=>v[1]>=2).sort((x,y)=>x[1][0]/x[1][1]-y[1][0]/y[1][1])[0];
 window.scrollTo({top:0});
 $('#app').innerHTML=`<section class="end"><div class="bigface"><img class="px fl" alt="" src="${cup({smile:true})}"></div>
 <div><div class="kicker rv">${done?(G.solo?'¡Superaste la oleada '+(G.wave+1)+' · '+WAVES[G.wave].t+'!':'¡Completaste las '+WAVES.length+' oleadas!'):'Te quedaste sin vidas en la oleada '+(G.wave+1)}</div>
 <h1 class="h1 rv" style="--d:1;font-size:clamp(46px,6.2vw,88px);margin-top:6px">${rt}</h1>
 <div class="stats rv" style="--d:2"><div class="stat"><b style="color:var(--red)">${G.score}</b><span>PUNTOS</span></div><div class="stat"><b>${acc}%</b><span>ACIERTOS</span></div><div class="stat"><b>×${G.best}</b><span>MEJOR COMBO</span></div><div class="stat"><b>${correct}/${G.log.length}</b><span>RONDAS</span></div><div class="stat"><b>${best}</b><span>RÉCORD</span></div></div>
 <div class="topics rv" style="--d:3">${Object.entries(byT).map(([k,v])=>`<span class="tchip" style="background:${TOPIC[k].col}">${TOPIC[k].ab} ${v[0]}/${v[1]}</span>`).join('')}</div>
 ${weak&&weak[1][0]<weak[1][1]?`<p class="rv" style="--d:3;margin-top:14px;font-size:16px">Para repasar: <b>${TOPIC[weak[0]].n}</b> (${weak[1][0]} de ${weak[1][1]} aciertos). Revisa abajo la explicación de cada error.</p>`:''}
 <div class="actions rv" style="--d:4"><button class="btn" id="again">${G.solo?'Repetir oleada':'Jugar otra vez'} ▸</button>${G.solo&&done&&G.wave<WAVES.length-1?'<button class="btn ghost" id="nextlvl">Oleada '+(G.wave+2)+' ▸</button>':''}<button class="btn ghost" id="home">Inicio</button></div>
 </div></section>
 ${wrong.length?`<h2 class="rowtitle">Repasa tus errores (${wrong.length})</h2><div class="review">${wrong.map(reviewCard).join('')}</div>`:''}
 ${right.length?`<h2 class="rowtitle">Lo que acertaste (${right.length})</h2><div class="review">${right.map(reviewCard).join('')}</div>`:''}
 ${foot('Caza-Bugs · Arrays en Java · Programación de Computadores')}`;
 const from=G.from,solo=G.solo,w=G.wave;$('#again').onclick=()=>start(from,solo);$('#home').onclick=intro;if($('#nextlvl'))$('#nextlvl').onclick=()=>start(w+1,true);
}
function reviewCard(l){
 const it=l.r.item,T=TOPIC[it.t];let what,detail;
 if(l.r.kind==='boss'){what=l.ok?'👑 Jefe derrotado':(l.how==='shot'?`👑 Elegiste ${esc(l.picked)}`:'👑 Se escapó el jefe');detail=`<b>${esc(it.q)}</b> Respuesta: <b>${esc(it.ops[0])}</b>. ${esc(it.x)}`}
 else{what=l.how==='shot'?(it.bug?'Derribaste un bug':'Disparaste a código correcto'):(it.bug?'Dejaste escapar un bug':'Dejaste pasar código correcto');detail=`${it.bug?'<b>Tenía bug.</b>':'<b>Era correcto.</b>'} ${esc(it.x)}`}
 return `<div class="rcard ${l.ok?'ok':''}"><div class="tico" style="background:${T.col}">${T.ab}</div><div><div class="tag">${l.ok?'✓':'✗'} ${what}</div><div class="code">${hl(it.c)}</div><div class="small">${detail}</div></div></div>`;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&G&&!G.paused&&$('#arena')){G.paused=true;const pAt=performance.now();const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="card"><div class="h2">Pausa</div><p class="small muted" style="margin:6px 0 14px">Respira. Los bugs te esperan.</p><button class="btn" id="res">Continuar ▸</button></div>';$('#arena').appendChild(o);$('#res').onclick=ev=>{ev.stopPropagation();o.remove();const dd=performance.now()-pAt;G.live.forEach(q=>q.born+=dd);if(G.boss&&G.boss.doneAt)G.boss.doneAt+=dd;G.paused=false;G.last=performance.now();loop()}}});
intro();
</script>
</body>
</html>
